[project]
name = "pdf-diploma-checker"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.32.5",
    "PyMuPDF==1.26.6",
    "PySide6==6.8.2",
    "numpy==2.3.4",
    "Pillow==12.2.0",
    "language-tool-python==3.2.2",
    "spacy==3.8.11",
    "lingua-language-detector==2.1.1",
    "morfeusz2==1.99.12",
    "pyspellchecker==0.9.0",
    "click==8.4.1",
    "pl_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "platformdirs>=4.12.3",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.0",
    "llama-cpp-python==0.3.16",
    "sentence-transformers==5.1.2",
    "transformers==4.57.1",
    "huggingface-hub>=0.20.0",
    "scikit-learn==1.7.2",
]
gpu = [
    "torch==2.9.0",
    "llama-cpp-python==0.3.16",
    "sentence-transformers==5.1.2",
    "transformers==4.57.1",
    "huggingface-hub>=0.20.0",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = [
    "pdoc==16.0.0",
    "ruff",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
src = ["src"]
