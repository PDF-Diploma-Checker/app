name: checks

on:
  pull_request:

env:
  UV_HTTP_TIMEOUT: "300"    # the spaCy models come from GitHub and often exceed the default 30 s

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff check
        run: uvx ruff check --select E9,F63,F7,F82 src

  compile:
    name: compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: compileall
        run: uv run --no-project python -m compileall -q src

  lockfile:
    name: uv.lock up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: uv lock --check
        run: uv lock --check

  unittest:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: install dependencies
        run: uv sync --frozen --no-dev

      - name: unittest
        run: uv run --no-sync python -m unittest discover -s unit_tests -t . -v

  dictionary-worker:
    name: dictionary worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: test dictionary service
        run: npm test --prefix dictionary_service/cloudflare
