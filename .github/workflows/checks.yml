name: checks

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff 
        run: uvx ruff check --select E9,F63,F7,F82 src

      - name: compileall
        run: uv run --no-project python -m compileall -q src
