# Builds the Linux release variants (base, cpu, gpu) in Docker on a GitHub runner: no Linux computer and no NVIDIA card
# needed. The result of each variant is the set of release files (full archive, parts, checksum, manifest and pack for
# differential updates). With "upload" ticked (and the DOWNLOAD_REPO_TOKEN secret set) they go straight into the
# DRAFT of the release in the download repository; the draft is never published by the workflow. Without it, download
# the artifacts and use  gh release upload <tag> <files> -R PDF-Diploma-Checker/diploma-checker-download
# The same build runs on your computer with tools/docker_build_linux.sh. The gpu variant can only be tested on a
# computer with an NVIDIA card (--analysis-test).

name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check the build against (e.g. v0.6.8); empty = only APP_VERSION"
        required: false
        default: ""
      variants:
        description: "Which variants to build: all, or a comma separated list (base,cpu,gpu)"
        required: false
        default: "all"
      upload:
        description: "Upload the files to the draft of the release (needs the DOWNLOAD_REPO_TOKEN secret and a tag)"
        type: boolean
        default: false
      ref:
        description: "Commit to build (empty = the head of the branch the workflow runs on)"
        required: false
        default: ""
  workflow_call:       # the release workflow builds with it what cannot be patched
    inputs:
      tag:
        type: string
        required: false
        default: ""
      variants:
        type: string
        required: false
        default: "all"
      upload:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: ""
    secrets:
      DOWNLOAD_REPO_TOKEN:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          if [ -z "$VARIANTS" ] || [ "$VARIANTS" = "all" ]; then VARIANTS="base,cpu,gpu"; fi
          echo "matrix={\"variant\":$(echo "$VARIANTS" | jq -Rc 'split(",") | map(select(length > 0))')}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: linux-${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.variant == 'gpu' && 350 || 150 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # the gpu build (environment, build, archives) needs tens of GB; remove what the runner has but we do not use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /

      - name: Build
        run: tools/docker_build_linux.sh ${{ matrix.variant }} ${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: DiplomaChecker-linux-${{ matrix.variant }}
          path: release_files/*
          compression-level: 0   # the archives are compressed already

  # Never publishes: the draft is published by hand when Windows and Linux, all variants, are in it.
  upload:
    needs: [plan, build]
    if: ${{ inputs.upload }}
    name: upload-linux-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: DiplomaChecker-linux-${{ matrix.variant }}
          path: release_files

      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_REPO_TOKEN }}   # a token with write access to the download repository
        run: |
          test -n "${{ inputs.tag }}" || { echo "Give the release tag to upload."; exit 1; }
          tools/upload_release_files.sh "${{ inputs.tag }}" linux ${{ matrix.variant }} release_files
