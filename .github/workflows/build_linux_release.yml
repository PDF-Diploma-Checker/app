# Builds the Linux release variants (base, cpu, gpu) in Docker on a GitHub runner: no Linux computer and no NVIDIA card
# needed. The result of each variant is the set of release files (full archive, parts, checksum, manifest and pack for
# differential updates). Upload them to the release draft with
#     gh release upload <tag> <files> -R PDF-Diploma-Checker/diploma-checker-download
# The same build runs on your computer with tools/docker_build_linux.sh. The gpu variant can only be tested on a
# computer with an NVIDIA card (--analysis-test).

name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check the build against (e.g. v0.6.6); empty = only APP_VERSION"
        required: false
        default: ""
      variants:
        description: "Which variants to build"
        type: choice
        options: [all, base, cpu, gpu]
        default: all

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [ -z "${{ inputs.variants }}" ] || [ "${{ inputs.variants }}" = "all" ]; then
            echo 'matrix={"variant":["base","cpu","gpu"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"variant":["${{ inputs.variants }}"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    name: linux-${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.variant == 'gpu' && 350 || 150 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # the gpu build (environment, build, archives) needs tens of GB; remove what the runner has but we do not use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /

      - name: Build
        run: tools/docker_build_linux.sh ${{ matrix.variant }} ${{ inputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: DiplomaChecker-linux-${{ matrix.variant }}
          path: release_files/*
          compression-level: 0   # the archives are compressed already
