name: Build Windows Executable

on:
  push:
    branches: [ exe ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          $pl_path = python -c "import pl_core_news_lg, pathlib; print(pathlib.Path(pl_core_news_lg.__file__).parent)"
          $en_path = python -c "import en_core_web_lg, pathlib; print(pathlib.Path(en_core_web_lg.__file__).parent)"
          
          Write-Host "PL Path: $pl_path"
          Write-Host "EN Path: $en_path"

          pyinstaller --noconsole --onedir --name="DiplomaChecker" --paths src `
            --hidden-import=PySide6 --hidden-import=styles --hidden-import=spacy `
            --collect-all spacy `
            --add-data "src/ui/assets;ui/assets" `
            --add-data "$pl_path;pl_core_news_lg" `
            --add-data "$en_path;en_core_web_lg" `
            src/app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiplomaChecker-Windows
          path: dist/DiplomaChecker/