name: Bump the version

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep the version one above the newest release
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R PDF-Diploma-Checker/diploma-checker-download --json tagName --jq .tagName)
          version=$(python3 tools/bump_version.py "$BEFORE" "$AFTER" "$latest")
          if [ -z "$version" ]; then
            echo "The version stays"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set the version to $version"
          git push
