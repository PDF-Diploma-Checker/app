name: Bump the version

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Raise the last number and commit it
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          version=$(python3 tools/bump_version.py "$BEFORE" "$AFTER")
          if [ -z "$version" ]; then
            echo "This merge set the version itself: it stays"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set the version to $version"
          git push
